; ============================================================================
;  Benshi Radio Simulator - ESP32 / PlatformIO
;  Simule le protocole Benshi (Bluetooth CLASSIC / RFCOMM) de la VR-N76,
;  pour être piloté par HTCommander (https://github.com/Ylianst/HTCommander).
;
;  Historique : la première version de ce projet tentait aussi un service
;  BLE (GATT) documenté par benlink pour d'autres modèles Benshi. Le dump
;  `bluetoothctl` d'une VRAIE VR-N76 a montré qu'elle n'utilise QUE du
;  Bluetooth Classic (BR/EDR) : Class of Device "audio-headset", SPP
;  standard + UUID vendor-specific, aucun service BLE. Le firmware est donc
;  désormais 100% Bluetooth Classic.
;  NOTE TECHNIQUE : c'est aussi une nécessité, pas juste un choix - NimBLE
;  (pile hôte BLE) et Bluedroid Classic (SPP) ne peuvent pas être actifs
;  simultanément dans un même firmware ESP32 (deux piles hôte différentes
;  et incompatibles sur un même contrôleur radio).
;
;  ATTENTION : ESP32 "classique" obligatoire (Bluetooth Classic + BLE
;  dual-mode au niveau du silicium). Les variantes S3 / C3 / C6 ne
;  supportent PAS le Bluetooth Classic (RFCOMM) matériellement.
;  => utiliser une carte type ESP32-WROOM-32 / ESP32-DevKitC / ESP32-WROVER.
; ============================================================================
[env:esp32dev]
; Plateforme figée : arduino-esp32 2.0.17 (IDF 4.4.7). Le service SDP vendor
; requis par HTCommander est publié via les fonctions bas niveau SDP_* de
; Bluedroid (voir src/VendorSdpRecord.h), présentes dans libbt.a - pas besoin
; d'IDF 5.x ni de CONFIG_BT_SDP (qui n'expose de toute façon esp_sdp_api.h
; dans AUCUNE des libs Arduino précompilées, 2.x comme 3.x).
platform = espressif32@6.11.0
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; Table de partition min_spiffs : appli ~1,9 Mo (le TNC AFSK + esp-dsp ne
; rentrent pas dans les 1,3 Mo de la table par defaut). Le projet stocke en
; NVS, pas en SPIFFS -> reduire SPIFFS est sans consequence.
board_build.partitions = min_spiffs.csv

; Modem AFSK 1200 pour le canal donnees / TNC APRS (memes libs que kv4p-ht) :
;   dkaukov/esp32-afsk  (GPL-3 -> ce firmware devient GPL-3)
;   esp-dsp est deja fourni par arduino-esp32 (libespressif__esp-dsp.a).
lib_deps =
    https://github.com/dkaukov/esp32-afsk.git

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -std=gnu++17
    ; en-tetes du codec SBC de Bluedroid (symboles deja dans libbt.a, voir lib/sbc/)
    -Ilib/sbc/include
    ; esp-dsp (FIR) pour le demodulateur AFSK, fourni par arduino-esp32
    -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/tools/sdk/esp32/include/espressif__esp-dsp/modules/common/include
    -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/tools/sdk/esp32/include/espressif__esp-dsp/modules/fir/include
    -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/tools/sdk/esp32/include/espressif__esp-dsp/modules/dotprod/include
    -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/tools/sdk/esp32/include/espressif__esp-dsp/modules/support/include
    -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/tools/sdk/esp32/include/espressif__esp-dsp/modules/support/mem/include
    ; débit AFSK aligné sur notre chaîne audio (ADC/DAC ~32 kHz)
    -DAFSK_SAMPLE_RATE=32000
build_unflags =
    -std=gnu++11

; deep+ : suit les #include conditionnels (SBC via lib/sbc/, AFSK via lib_deps).
lib_ldf_mode = deep+
