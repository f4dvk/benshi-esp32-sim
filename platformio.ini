; ============================================================================
;  Benshi Radio Simulator - ESP32 / PlatformIO
;  Simule le protocole Benshi (Bluetooth CLASSIC / RFCOMM) de la VR-N76,
;  pour être piloté par HTCommander (https://github.com/Ylianst/HTCommander).
;
;  Historique : la première version de ce projet tentait aussi un service
;  BLE (GATT) documenté par benlink pour d'autres modèles Benshi. Le dump
;  `bluetoothctl` d'une VRAIE VR-N76 a montré qu'elle n'utilise QUE du
;  Bluetooth Classic (BR/EDR) : Class of Device "audio-headset", SPP
;  standard + UUID vendor-specific, aucun service BLE. Le firmware est donc
;  désormais 100% Bluetooth Classic.
;  NOTE TECHNIQUE : c'est aussi une nécessité, pas juste un choix - NimBLE
;  (pile hôte BLE) et Bluedroid Classic (SPP) ne peuvent pas être actifs
;  simultanément dans un même firmware ESP32 (deux piles hôte différentes
;  et incompatibles sur un même contrôleur radio).
;
;  ATTENTION : ESP32 "classique" obligatoire (Bluetooth Classic + BLE
;  dual-mode au niveau du silicium). Les variantes S3 / C3 / C6 ne
;  supportent PAS le Bluetooth Classic (RFCOMM) matériellement.
;  => utiliser une carte type ESP32-WROOM-32 / ESP32-DevKitC / ESP32-WROVER.
; ============================================================================
[env:esp32dev]
; Plateforme figée : arduino-esp32 2.0.17 (IDF 4.4.7). Le service SDP vendor
; requis par HTCommander est publié via les fonctions bas niveau SDP_* de
; Bluedroid (voir src/VendorSdpRecord.h), présentes dans libbt.a - pas besoin
; d'IDF 5.x ni de CONFIG_BT_SDP (qui n'expose de toute façon esp_sdp_api.h
; dans AUCUNE des libs Arduino précompilées, 2.x comme 3.x).
platform = espressif32@6.11.0
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; Aucune lib externe : tout repose sur l'API Bluedroid Classic (esp_spp_api.h,
; esp_gap_bt_api.h, esp_bt_device.h) déjà fournie par le framework Arduino-ESP32.

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -std=gnu++17
build_unflags =
    -std=gnu++11
